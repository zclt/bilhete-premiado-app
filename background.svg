<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="distorcao">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="turb"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="8" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
    <pattern id="xadrez" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="20" height="20" fill="#2da84c" fill-opacity="0.06"></rect>
      <rect x="20" y="20" width="20" height="20" fill="#2da84c" fill-opacity="0.06"></rect>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#xadrez)" filter="url(#distorcao)"></rect>
</svg>
